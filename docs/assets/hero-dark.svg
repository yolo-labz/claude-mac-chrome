<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="cmac-hero-title cmac-hero-desc">
  <title id="cmac-hero-title">claude-mac-chrome: Chrome multi-profile automation for Claude Code on macOS</title>
  <desc id="cmac-hero-desc">Catppuccin Mocha card. Left panel shows the wordmark claude-mac-chrome in mauve over a monospaced tagline. Right panel shows three stacked Chrome browser silhouettes with a fingerprint glyph mapping each silhouette to a distinct stable window ID.</desc>
