name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install radamsa (build from source)
        # apt install radamsa started failing on ubuntu-latest in 2026-Q2 —
        # the package is in universe and the github-hosted runner image no
        # longer enables that pocket on every minor version. Build radamsa
        # ourselves; its ~10s and pin-stable to the upstream tag.
        run: |
          git clone --depth 1 --branch v0.6 https://gitlab.com/akihe/radamsa.git /tmp/radamsa
          cd /tmp/radamsa
          make
          sudo make install
          radamsa --version
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.1"
      - name: Fuzz URL blocklist with radamsa
        run: bash tests/fuzz/radamsa-urls.sh
      - name: Fuzz HTML grammar
        run: node tests/fuzz/html-grammar.mjs --iterations=10000
      - name: Fuzz Unicode confusables
        run: node tests/fuzz/unicode-confusables.mjs
      - name: File or update issue on crash
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        with:
          script: |
            // Dedup: find any open issue with the canonical title and append a
            // run-link comment instead of opening another duplicate. 12+ open
            // fuzz auto-issues demonstrate the runaway-dup defect this fixes.
            const runId = process.env.RUN_ID;
            const repoUrl = process.env.REPO_URL;
            const title = '[fuzz] P1 — crash or envelope violation in nightly fuzz run';
            const body = `Run: ${repoUrl}/actions/runs/${runId}\n\nSee logs for reproducer.`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fuzz,p1',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurrence: ${repoUrl}/actions/runs/${runId}`,
              });
              core.notice(`Recurrence appended to #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['fuzz', 'p1', 'security'],
              });
              core.notice(`Filed new issue #${created.data.number}`);
            }
