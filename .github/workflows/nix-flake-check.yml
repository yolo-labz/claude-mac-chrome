name: Nix flake check

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-flake-check.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "scripts/lint.sh"
      - "skills/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --no-build
      - name: Verify lock file consistency
        run: |
          if ! git diff --exit-code flake.lock; then
            echo "FATAL: flake.lock is stale — run 'nix flake lock' locally and commit"
            exit 1
          fi
