name: Nix flake check

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-flake-check.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "scripts/lint.sh"
      - "skills/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --no-build
      - name: Verify lock file consistency
        run: |
          if ! git diff --exit-code flake.lock; then
            echo "FATAL: flake.lock is stale — run 'nix flake lock' locally and commit"
            exit 1
          fi
