name: Playwright integration

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.18.1"
      # chrome-lib.sh hard-requires Bash 4.0+ and macOS ships 3.2 (frozen since
      # 2007); the suite spawns `bash` from PATH, so install brew's bash, which
      # /opt/homebrew/bin puts ahead of /bin/bash. This is the lib's own
      # documented remedy and the reason this job has been red since 2026-05-30.
      - name: Install modern Bash
        run: |
          brew install bash
          bash --version | head -1
      - name: Install Playwright deps
        working-directory: tests/integration
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: tests/integration
        run: npx playwright test --reporter=line
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace
          path: tests/integration/test-results/
          retention-days: 7
